<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">

        <!-- FAVORITE ICON / LOGO TAB BROWSER -->
        <link rel="icon" type="image/png" href="images/symbolise.png">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>

        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        /* Styling Banner Header Logo & Judul */
        .map-header {
            position: absolute;
            top: 10px;
            left: 55px;
            z-index: 1000;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 10px 16px;
            border-radius: 8px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.25);
            display: flex;
            align-items: center;
            gap: 15px; /* Jarak antara grup logo dan teks */
            max-width: calc(100% - 80px);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 2px; /* <-- PENGATURAN JARAK/SPACE ANTAR-LOGO DI SINI */
        }

        .map-header img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .img-dark-bg {
            background-color: #ffffff;
            padding: 3px;
            border-radius: 4px;
        }

        .header-text h1 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #2c3e50;
            line-height: 1.2;
        }

        .header-text p {
            margin: 3px 0 0 0;
            font-size: 8px; /* <-- UKURAN FONT SUBJUDUL DIKECILKAN DI SINI */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #555555;
        }

        @media (max-width: 600px) {
            .map-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .map-header img {
                height: 35px;
            }
            .header-text h1 {
                font-size: 14px;
            }
            .header-text p {
                font-size: 9px;
            }
        }
        </style>
        <title>Pemetaan Desa Adat Sibetan</title>
    </head>
    <body>
        <div id="map">
            <!-- HEADER LOGO DAN JUDUL -->
            <div class="map-header">
                <div class="logo-group">
                    <!-- Urutan: DPPM (kiri), Unwar (tengah), Desa Adat Sibetan (kanan) -->
                    <img src="images/dppm.png" alt="Logo DPPM">
                    <img src="images/unwar_white.png" alt="Logo Unwar" class="img-dark-bg">
                    <img src="images/Desa_Adat_Sibetan.png" alt="Logo Desa Adat Sibetan">
                </div>
                <div class="header-text">
                    <h1>Pemetaan Desa Adat Sibetan</h1>
                    <p>Kerjasama DPPM Universitas Warmadewa dan Desa Adat Sibetan</p>
                </div>
            </div>

            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>
        </div>
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="resources/olms.js"></script>
        <script src="layers/PolaRuang_1.js"></script><script src="layers/BatasDesaDinas_2.js"></script><script src="layers/Sungai_3.js"></script><script src="layers/Jalan_4.js"></script><script src="layers/KonturInterval5m_5.js"></script>
        <script src="styles/PolaRuang_1_style.js"></script><script src="styles/BatasDesaDinas_2_style.js"></script><script src="styles/Sungai_3_style.js"></script><script src="styles/Jalan_4_style.js"></script><script src="styles/KonturInterval5m_5_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>        
    </body>
</html>
